name: Publish WonderNet developer preview

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/build_pages_preview.py"
      - "scripts/preview.css"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static developer preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build public preview (no server-side code)
        run: python scripts/build_pages_preview.py --output _site --base-path /wondernet
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy public preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
