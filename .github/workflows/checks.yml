name: CI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run smoke tests
        run: python -m pytest -q
      - name: Verify original offline Book Dash content hashes
        run: python scripts/import_bookdash.py --verify-only
      - name: Check the static site export
        run: python scripts/build_pages_preview.py --output /tmp/wondernet-site --base-path /wondernet
      - name: Check actual Library layout in Chromium at phone and desktop widths
        run: |
          python -m pip install playwright==1.56.0
          python scripts/check_bookdash_mobile_browser.py
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/assets/main.js
          node --check frontend/assets/activities.js
          node --check frontend/assets/circuit-engine.js
          node --check frontend/assets/circuit-garden.js
          node --check frontend/assets/word-workshop-engine.js
          node --check frontend/assets/word-workshop.js
          node --check frontend/assets/library-shelf.js
          node --check frontend/assets/book-reader.js
      - name: Test Circuit Garden puzzles
        run: node --test tests/circuit-garden.test.cjs
      - name: Test Word Workshop puzzles
        run: node --test tests/word-workshop.test.cjs
      - name: Test Word Workshop touch and mouse interactions
        run: node --test tests/word-workshop-gesture.test.cjs
      - name: Test offline book reader controls
        run: node --test tests/book-reader.test.cjs
