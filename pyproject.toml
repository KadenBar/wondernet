[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wondernet"
version = "0.1.0"
description = "Offline-first educational and entertainment platform prototype"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
